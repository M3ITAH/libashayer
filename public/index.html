<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شات البثوث</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#14111f; --panel:#1f1b2e; --line:#342e4d; --text:#f4f1fa; --muted:#a59fb8;
    --tiktok:#25f4ee; --twitch:#9146ff; --kick:#53fc18; --gift:#ffb020; --red:#ff5c6c; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { font-family:'Readex Pro',Tahoma,sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; }
  header { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:10px; }
  .card { background:var(--panel); border-radius:12px; padding:8px 12px; border-top:3px solid var(--c); min-width:0; }
  .card b { font-size:15px; } .card .row { display:flex; gap:12px; font-size:14px; margin-top:2px; }
  .card .st { font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#585270; margin-inline-end:6px; }
  .live .dot { background:var(--red); box-shadow:0 0 6px var(--red); }
  nav { display:flex; gap:6px; padding:0 10px 8px; }
  nav button { font:inherit; font-size:13px; padding:5px 14px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--muted); cursor:pointer; }
  nav button[aria-pressed=true] { background:var(--line); color:var(--text); }
  #feed { flex:1; overflow-y:auto; padding:0 10px; display:flex; flex-direction:column; gap:5px; }
  #feed[data-f=tiktok] .msg:not([data-src=tiktok]), #feed[data-f=twitch] .msg:not([data-src=twitch]), #feed[data-f=kick] .msg:not([data-src=kick]) { display:none; }
  .msg { position:relative; background:var(--panel); border-radius:10px; padding:7px 10px; border-inline-start:4px solid var(--c); font-size:16px; line-height:1.55; overflow-wrap:anywhere; display:flex; gap:8px; align-items:flex-start; }
  [data-src=tiktok] { --c:var(--tiktok); } [data-src=twitch] { --c:var(--twitch); } [data-src=kick] { --c:var(--kick); }
  .av { width:28px; height:28px; border-radius:50%; background:#3a3550 center/cover; flex:none; }
  .name { font-weight:700; margin-inline-end:6px; font-size:15px; color:var(--muted); unicode-bidi:plaintext; }
  .badge { font-size:11px; padding:1px 6px; border-radius:6px; background:var(--line); margin-inline-end:5px; }
  .emote { height:28px; vertical-align:middle; }
  a.link { color:#7fc4ff; }
  .gift { background:linear-gradient(270deg,rgba(255,176,32,.25),var(--panel) 70%); }
  .gift .name,.big { color:var(--gift); font-weight:700; }
  .gift img.gi { width:32px; height:32px; vertical-align:middle; }
  .ev { font-size:14px; color:#d6d0e6; }
  .acts { display:none; position:absolute; inset-inline-end:8px; top:-14px; gap:4px; background:#2a2540; border:1px solid var(--line); border-radius:8px; padding:3px; }
  .msg:hover .acts, .msg.open .acts, .msg:focus-within .acts { display:flex; }
  .acts button { font:inherit; font-size:12px; padding:3px 8px; border-radius:6px; border:0; background:#3a3454; color:var(--text); cursor:pointer; }
  .acts button.danger { background:#6b2a38; }
  footer { padding:10px; border-top:1px solid var(--line); display:flex; gap:8px; align-items:center; }
  footer input { flex:1; font:inherit; padding:9px 12px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--text); min-width:0; }
  footer button, #login { font:inherit; padding:9px 16px; border-radius:10px; border:0; background:var(--twitch); color:#fff; font-weight:700; cursor:pointer; }
  footer small { color:var(--muted); font-size:12px; }
  #toast { position:fixed; bottom:70px; inset-inline:0; margin:auto; width:max-content; max-width:90%; background:#0c0a14; border:1px solid var(--line); padding:8px 14px; border-radius:10px; font-size:14px; opacity:0; pointer-events:none; transition:opacity .2s; }
  #toast.on { opacity:1; }
  :focus-visible { outline:2px solid var(--tiktok); outline-offset:2px; }
  @media (max-width:560px){ header{grid-template-columns:1fr;} .card{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .card .st{display:none} }
</style>
</head>
<body>
<header id="stats"></header>
<nav id="tabs">
  <button data-f="all" aria-pressed="true">الكل</button>
  <button data-f="tiktok" aria-pressed="false">تيك توك</button>
  <button data-f="twitch" aria-pressed="false">تويتش</button>
  <button data-f="kick" aria-pressed="false">كيك</button>
</nav>
<main id="feed" data-f="all" aria-live="polite"></main>
<footer id="bar"></footer>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const NAMES = { tiktok: 'تيك توك', twitch: 'تويتش', kick: 'كيك' };
const S = { tiktok: {}, twitch: {}, kick: {} };
const tw = { token: null, userId: null, login: null, chanId: null };
let cfg = {};
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const esc = s => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };
const num = n => (n == null ? '—' : Number(n).toLocaleString('en'));
let toastT;
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('on'), 3500); }

// ---------- الإحصائيات ----------
function renderStats() {
  $('#stats').innerHTML = ['tiktok', 'twitch', 'kick'].map(k => {
    const s = S[k];
    return `<div class="card ${s.live ? 'live' : ''}" style="--c:var(--${k})">
      <b><span class="dot"></span>${NAMES[k]}</b>
      <div class="row"><span>👥 ${num(s.followers)} متابع</span><span>👁 ${s.live ? num(s.viewers) : 'أوفلاين'}</span></div>
      <div class="st">${esc(s.status || '')}</div></div>`;
  }).join('');
}
renderStats();

// ---------- تنسيق النص (روابط + إيموجي) ----------
function linkify(t) {
  return esc(t).replace(/(https?:\/\/[^\s<]+|www\.[^\s<]+)/gi, u => {
    const href = u.startsWith('www.') ? 'https://' + u : u;
    return `<a class="link" href="${href}" target="_blank" rel="noopener noreferrer nofollow">${u}</a>`;
  });
}
function fmtTwitch(text, emotesTag) {
  if (!emotesTag) return linkify(text);
  const chars = Array.from(text), spans = [];
  for (const e of emotesTag.split('/')) {
    const [id, ranges] = e.split(':');
    for (const r of ranges.split(',')) { const [a, b] = r.split('-').map(Number); spans.push({ a, b, id }); }
  }
  spans.sort((x, y) => x.a - y.a);
  let out = '', pos = 0;
  for (const s of spans) {
    out += linkify(chars.slice(pos, s.a).join(''));
    out += `<img class="emote" alt="${esc(chars.slice(s.a, s.b + 1).join(''))}" src="https://static-cdn.jtvnw.net/emoticons/v2/${s.id}/default/dark/1.0">`;
    pos = s.b + 1;
  }
  return out + linkify(chars.slice(pos).join(''));
}
function fmtKick(text) {
  return String(text ?? '').split(/(\[emote:\d+:[^\]]+\])/).map(p => {
    const m = p.match(/^\[emote:(\d+):([^\]]+)\]$/);
    return m ? `<img class="emote" alt="${esc(m[2])}" src="https://files.kick.com/emotes/${m[1]}/fullsize">` : linkify(p);
  }).join('');
}

// ---------- الفيد ----------
const feed = $('#feed');
function add(d, cls, html, extra = {}) {
  const near = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80;
  const el = document.createElement('div');
  el.className = 'msg ' + cls; el.dataset.src = d.source;
  Object.assign(el.dataset, extra);
  const av = d.avatar ? `<div class="av" style="background-image:url('${esc(d.avatar)}')"></div>` : '';
  const acts = extra.uid ? `<div class="acts">
      <button data-act="to">تايم أوت 10د</button><button data-act="so">شوت أوت</button>
      <button data-act="del">حذف</button><button data-act="ban" class="danger">باند</button></div>` : '';
  el.innerHTML = `${av}<div>${html}</div>${acts}`;
  feed.appendChild(el);
  while (feed.children.length > 300) feed.removeChild(feed.firstChild);
  if (near) feed.scrollTop = feed.scrollHeight;
}
const nm = d => `<span class="name"${d.color ? ` style="color:${esc(d.color)}"` : ''}>${esc(d.name)}</span>`;

function render(d) {
  const n = nm(d);
  switch (d.type) {
    case 'chat': add(d, 'chat', n + (d.source === 'kick' ? fmtKick(d.text) : linkify(d.text))); break;
    case 'gift': add(d, 'gift', `${n}<span class="big">أرسل ${esc(d.gift)} ×${d.count}</span> ${d.icon ? `<img class="gi" src="${esc(d.icon)}" alt="">` : ''}<span class="ev">(${d.diamonds} 💎)</span>`); break;
    case 'follow': add(d, 'follow', `${n}<span class="ev">تابع الحساب</span>`); break;
    case 'share': add(d, 'share', `${n}<span class="ev">شارك البث</span>`); break;
    case 'sub': add(d, 'sub', `${n}<span class="ev">اشترك ⭐</span>`); break;
    case 'subgift': add(d, 'sub', `${n}<span class="ev">أهدى ${d.count} اشتراك 🎁</span>`); break;
    case 'notice': add(d, 'sub', `<span class="ev">${esc(d.text)}</span>`); break;
  }
}

$('#tabs').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  feed.dataset.f = b.dataset.f;
  document.querySelectorAll('#tabs button').forEach(x => x.setAttribute('aria-pressed', x === b));
  feed.scrollTop = feed.scrollHeight;
};

// ---------- تيك توك + كيك (من السيرفر) ----------
function startServerFeed() {
  const es = new EventSource('/events');
  es.onmessage = ev => {
    const d = JSON.parse(ev.data);
    if (d.type === 'stats') { Object.assign(S[d.source], d); renderStats(); } else render(d);
  };
}

// ---------- تويتش: قراءة الشات (بدون تسجيل دخول) ----------
function startTwitchChat() {
  const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  ws.onopen = () => {
    ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
    ws.send('PASS SCHMOOPIIE'); ws.send('NICK justinfan' + Math.floor(Math.random() * 90000 + 10000));
    ws.send('JOIN #' + cfg.twitch.toLowerCase());
  };
  ws.onmessage = ev => ev.data.split('\r\n').filter(Boolean).forEach(line => {
    if (line.startsWith('PING')) return ws.send('PONG :tmi.twitch.tv');
    const m = line.match(/^(?:@(\S+) )?:(\S+?)(?:!\S+)? (PRIVMSG|USERNOTICE|JOIN) #\S+(?: :(.*))?$/);
    if (!m) return;
    const tags = {};
    (m[1] || '').split(';').forEach(p => { const i = p.indexOf('='); tags[p.slice(0, i)] = p.slice(i + 1); });
    if (m[3] === 'JOIN') { S.twitch.status = 'متصل'; renderStats(); return; }
    if (m[3] === 'USERNOTICE') {
      const sys = (tags['system-msg'] || '').replace(/\\s/g, ' ');
      if (sys) render({ source: 'twitch', type: 'notice', text: sys + (m[4] ? ' — ' + m[4] : '') });
      return;
    }
    const name = tags['display-name'] || m[2];
    const badges = (tags.badges || '').split(',').map(b => b.split('/')[0]);
    const label = badges.includes('broadcaster') ? 'البث' : badges.includes('moderator') ? 'مود' : badges.includes('vip') ? 'VIP' : badges.includes('subscriber') ? 'مشترك' : '';
    const d = { source: 'twitch', color: tags.color || '', name };
    add(d, 'chat',
      (label ? `<span class="badge">${label}</span>` : '') + nm(d) + fmtTwitch(m[4] || '', tags.emotes),
      { uid: tags['user-id'], login: m[2], mid: tags.id });
  });
  ws.onclose = () => { S.twitch.status = 'انقطع، أعيد الاتصال...'; renderStats(); setTimeout(startTwitchChat, 4000); };
}

async function pollTwitchStats() {
  try {
    const f = (await (await fetch(`https://decapi.me/twitch/followcount/${cfg.twitch}`)).text()).trim();
    if (/^\d+$/.test(f)) S.twitch.followers = +f;
    const v = (await (await fetch(`https://decapi.me/twitch/viewercount/${cfg.twitch}`)).text()).trim();
    if (/^\d+$/.test(v)) { S.twitch.viewers = +v; S.twitch.live = true; } else { S.twitch.viewers = 0; S.twitch.live = false; }
  } catch {}
  renderStats();
}

// ---------- تويتش: تسجيل الدخول والمودريشن ----------
const SCOPES = ['user:write:chat', 'moderator:manage:banned_users', 'moderator:manage:chat_messages',
  'moderator:manage:shoutouts', 'moderator:manage:announcements'];

function login() {
  const state = crypto.randomUUID();
  try { sessionStorage.setItem('tw_state', state); } catch {}
  location.href = 'https://id.twitch.tv/oauth2/authorize?' + new URLSearchParams({
    client_id: cfg.twitchClientId, redirect_uri: location.origin + '/', response_type: 'token',
    scope: SCOPES.join(' '), state });
}
function logout() { store.del('tw_token'); location.reload(); }

function readAuthHash() {
  if (!location.hash.includes('access_token')) return;
  const p = new URLSearchParams(location.hash.slice(1));
  let ok = false;
  try { ok = p.get('state') === sessionStorage.getItem('tw_state'); } catch {}
  if (ok && p.get('access_token')) store.set('tw_token', p.get('access_token'));
  history.replaceState(null, '', location.pathname);
}

async function helix(method, path, body) {
  const r = await fetch('https://api.twitch.tv/helix/' + path, {
    method,
    headers: { Authorization: 'Bearer ' + tw.token, 'Client-Id': cfg.twitchClientId, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 401) { store.del('tw_token'); throw new Error('انتهت الجلسة، اربط حساب تويتش من جديد'); }
  if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.message || 'خطأ ' + r.status); }
  return r.status === 204 ? null : r.json();
}
async function idOf(l) {
  const j = await helix('GET', 'users?login=' + encodeURIComponent(l));
  if (!j.data[0]) throw new Error('المستخدم غير موجود');
  return j.data[0].id;
}
const q = () => `broadcaster_id=${tw.chanId}&moderator_id=${tw.userId}`;

async function doAction(act, el) {
  const uid = el.dataset.uid, name = el.dataset.login, mid = el.dataset.mid;
  if (act === 'to') { await helix('POST', 'moderation/bans?' + q(), { data: { user_id: uid, duration: 600 } }); toast(`تايم أوت 10 دقايق: ${name}`); }
  if (act === 'ban') { if (!confirm(`حظر ${name} نهائياً؟`)) return; await helix('POST', 'moderation/bans?' + q(), { data: { user_id: uid } }); toast(`تم حظر ${name}`); }
  if (act === 'del') { await helix('DELETE', `moderation/chat?${q()}&message_id=${mid}`); toast('تم حذف الرسالة'); }
  if (act === 'so') { await helix('POST', `chat/shoutouts?from_broadcaster_id=${tw.chanId}&to_broadcaster_id=${uid}&moderator_id=${tw.userId}`); toast(`شوت أوت لـ ${name}`); }
}

async function submit(text) {
  text = text.trim(); if (!text) return;
  if (!text.startsWith('/')) { await helix('POST', 'chat/messages', { broadcaster_id: tw.chanId, sender_id: tw.userId, message: text }); return; }
  const [cmd, ...a] = text.slice(1).split(/\s+/);
  const user = (a[0] || '').replace('@', '').toLowerCase();
  switch (cmd.toLowerCase()) {
    case 'timeout': case 't': { const id = await idOf(user); const s = parseInt(a[1]) || 600;
      await helix('POST', 'moderation/bans?' + q(), { data: { user_id: id, duration: s, reason: a.slice(2).join(' ') || undefined } }); toast(`تايم أوت ${s} ثانية: ${user}`); break; }
    case 'ban': { const id = await idOf(user);
      await helix('POST', 'moderation/bans?' + q(), { data: { user_id: id, reason: a.slice(1).join(' ') || undefined } }); toast(`تم حظر ${user}`); break; }
    case 'unban': case 'untimeout': { const id = await idOf(user);
      await helix('DELETE', `moderation/bans?${q()}&user_id=${id}`); toast(`رُفع الحظر عن ${user}`); break; }
    case 'so': case 'shoutout': { const id = await idOf(user);
      await helix('POST', `chat/shoutouts?from_broadcaster_id=${tw.chanId}&to_broadcaster_id=${id}&moderator_id=${tw.userId}`); toast(`شوت أوت لـ ${user}`); break; }
    case 'announce': await helix('POST', 'chat/announcements?' + q(), { message: a.join(' ') }); break;
    case 'clear': await helix('DELETE', 'moderation/chat?' + q()); toast('تم مسح الشات'); break;
    default: throw new Error('أمر غير معروف. المتاح: /timeout /ban /unban /so /announce /clear');
  }
}

feed.addEventListener('click', async e => {
  const msg = e.target.closest('.msg'); if (!msg) return;
  const b = e.target.closest('button[data-act]');
  if (!b) { if (!e.target.closest('a') && msg.dataset.uid) msg.classList.toggle('open'); return; }
  try { await doAction(b.dataset.act, msg); } catch (err) { toast(err.message); }
});

async function setupBar() {
  const bar = $('#bar');
  if (!cfg.twitchClientId) { bar.innerHTML = '<small>ربط تويتش غير مفعّل: ينقص TWITCH_CLIENT_ID في إعدادات السيرفر.</small>'; return; }
  tw.token = store.get('tw_token');
  if (!tw.token) { bar.innerHTML = '<button id="login" type="button">ربط حساب تويتش (للرد والمودريشن)</button>'; $('#login').onclick = login; return; }
  try {
    const v = await (await fetch('https://id.twitch.tv/oauth2/validate', { headers: { Authorization: 'OAuth ' + tw.token } })).json();
    if (!v.user_id) throw new Error();
    tw.userId = v.user_id; tw.login = v.login; tw.chanId = await idOf(cfg.twitch);
  } catch { store.del('tw_token'); bar.innerHTML = '<button id="login" type="button">ربط حساب تويتش (للرد والمودريشن)</button>'; $('#login').onclick = login; return; }
  bar.innerHTML = `<input id="msg" placeholder="اكتب رسالة لشات تويتش أو أمر مثل /timeout اسم 600" autocomplete="off">
    <button id="send" type="button">إرسال</button><small>${esc(tw.login)} · <a href="#" id="out" class="link">خروج</a></small>`;
  const go = async () => { const i = $('#msg'); const t = i.value; i.value = ''; try { await submit(t); } catch (err) { toast(err.message); i.value = t; } };
  $('#send').onclick = go;
  $('#msg').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('#out').onclick = e => { e.preventDefault(); logout(); };
}

(async function init() {
  cfg = await fetch('/config').then(r => r.json()).catch(() => ({ twitch: 'libashayer' }));
  readAuthHash();
  startServerFeed();
  startTwitchChat();
  pollTwitchStats(); setInterval(pollTwitchStats, 30000);
  setupBar();
})();
</script>
</body>
</html>
