<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شات البثوث</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#14111f; --panel:#1f1b2e; --line:#342e4d; --text:#f4f1fa; --muted:#a59fb8;
    --tiktok:#25f4ee; --twitch:#9146ff; --kick:#53fc18; --gift:#ffb020; --red:#ff5c6c; }
  * { box-sizing:border-box; }
  html { background:var(--bg); }
  html,body { height:100%; margin:0; }
  body[data-pos=right], body[data-pos=left] { max-width:480px; }
  body[data-pos=right] { margin-left:auto; border-left:1px solid var(--line); }
  body[data-pos=left] { margin-right:auto; border-right:1px solid var(--line); }
  body { font-family:'Readex Pro',Tahoma,sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; }
  header { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:10px; }
  .card { background:var(--panel); border-radius:12px; padding:8px 12px; border-top:3px solid var(--c); min-width:0; }
  .card b { font-size:15px; } .card .row { display:flex; gap:12px; font-size:14px; margin-top:2px; }
  .card .st { font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#585270; margin-inline-end:6px; }
  .live .dot { background:var(--red); box-shadow:0 0 6px var(--red); }
  nav { display:flex; gap:6px; padding:0 10px 8px; flex-wrap:wrap; align-items:center; }
  #tabs, #pos { display:flex; gap:6px; }
  #pos { margin-inline-start:auto; align-items:center; font-size:12px; color:var(--muted); }
  #pos button { padding:5px 10px; }
  .plat { display:inline-block; margin-inline-end:6px; }
  .plat svg { width:16px; height:16px; vertical-align:-3px; fill:currentColor; }
  .bdg { height:18px; width:18px; vertical-align:-4px; margin-inline-end:4px; }
  .bdg-e { margin-inline-end:4px; font-size:14px; }
  .sub-tag { font-size:11px; font-weight:700; padding:1px 7px; border-radius:6px; background:#3a3454; color:var(--gift); margin-inline-end:5px; vertical-align:1px; }
  nav button { font:inherit; font-size:13px; padding:5px 14px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--muted); cursor:pointer; }
  nav button[aria-pressed=true] { background:var(--line); color:var(--text); }
  #feed { flex:1; overflow-y:auto; padding:0 10px; display:flex; flex-direction:column; gap:5px; }
  #feed[data-f=tiktok] .msg:not([data-src=tiktok]), #feed[data-f=twitch] .msg:not([data-src=twitch]), #feed[data-f=kick] .msg:not([data-src=kick]) { display:none; }
  .msg { position:relative; background:var(--panel); border-radius:10px; padding:7px 10px; border-inline-start:4px solid var(--c); font-size:16px; line-height:1.55; overflow-wrap:anywhere; display:flex; gap:8px; align-items:flex-start; }
  [data-src=tiktok] { --c:var(--tiktok); } [data-src=twitch] { --c:var(--twitch); } [data-src=kick] { --c:var(--kick); }
  .av { width:28px; height:28px; border-radius:50%; background:#3a3550 center/cover; flex:none; }
  .name { font-weight:700; margin-inline-end:6px; font-size:15px; color:var(--muted); unicode-bidi:plaintext; }
  .badge { font-size:11px; padding:1px 6px; border-radius:6px; background:var(--line); margin-inline-end:5px; }
  .emote { height:28px; vertical-align:middle; }
  a.link { color:#7fc4ff; }
  .gift { background:linear-gradient(270deg,rgba(255,176,32,.25),var(--panel) 70%); }
  .gift .name,.big { color:var(--gift); font-weight:700; }
  .gift img.gi { width:32px; height:32px; vertical-align:middle; }
  .ev { font-size:14px; color:#d6d0e6; }
  .acts { display:none; position:absolute; inset-inline-end:8px; top:-14px; gap:4px; background:#2a2540; border:1px solid var(--line); border-radius:8px; padding:3px; }
  .msg:hover .acts, .msg.open .acts, .msg:focus-within .acts { display:flex; }
  .acts button { font:inherit; font-size:12px; padding:3px 8px; border-radius:6px; border:0; background:#3a3454; color:var(--text); cursor:pointer; }
  .acts button.danger { background:#6b2a38; }
  footer { padding:10px; border-top:1px solid var(--line); display:flex; gap:8px; align-items:center; }
  footer input { flex:1; font:inherit; padding:9px 12px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--text); min-width:0; }
  footer button, #login { font:inherit; padding:9px 16px; border-radius:10px; border:0; background:var(--twitch); color:#fff; font-weight:700; cursor:pointer; }
  footer small { color:var(--muted); font-size:12px; }
  #toast { position:fixed; bottom:70px; inset-inline:0; margin:auto; width:max-content; max-width:90%; background:#0c0a14; border:1px solid var(--line); padding:8px 14px; border-radius:10px; font-size:14px; opacity:0; pointer-events:none; transition:opacity .2s; }
  #toast.on { opacity:1; }
  :focus-visible { outline:2px solid var(--tiktok); outline-offset:2px; }
  @media (max-width:560px){ header{grid-template-columns:1fr;} .card{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .card .st{display:none} }

  /* ===== شكل شات تويتش: سطر مضغوط (وقت، أزرار مود، شارات، اسم: كلام) ===== */
  #feed { direction:ltr; gap:0; }
  .msg { display:block; direction:ltr; text-align:left; background:transparent; border-radius:6px; border-inline-start:0; padding:3px 8px; line-height:1.75; font-size:16px; }
  .msg:hover { background:rgba(255,255,255,.05); }
  .msg.gift { background:linear-gradient(90deg,rgba(255,176,32,.22),transparent 75%); }
  .msg .time { color:var(--muted); font-size:12px; margin-right:8px; }
  .acts { display:inline-flex; position:static; gap:2px; background:none; border:0; padding:0; margin-right:6px; vertical-align:middle; }
  .msg:hover .acts, .msg.open .acts, .msg:focus-within .acts { display:inline-flex; }
  .acts button { padding:2px; background:none; color:#b9b3cc; border-radius:4px; display:inline-flex; opacity:.7; }
  .acts button:hover { background:#3a3454; color:#fff; opacity:1; }
  .acts svg { width:16px; height:16px; fill:currentColor; }
  .name { margin-inline-end:0; }
  .colon { margin-inline-end:6px; }
  .txt { unicode-bidi:plaintext; }
  .tag { font-size:11px; font-weight:700; padding:1px 7px; border-radius:6px; margin-inline-end:5px; vertical-align:1px; background:#3a3454; }
  .tag.mod { background:#0a4d0c; color:#6dff70; }
  .tag.vip { background:#5a0a4d; color:#ff6be6; }
  .tag.sub { color:var(--gift); }
  .tag.owner { background:#5a1420; color:#ff8a98; }

  /* ===== صور الحسابات ===== */
  .av { width:22px; height:22px; border-radius:50%; object-fit:cover; background:#3a3550; vertical-align:middle; margin-inline-end:6px; flex:none; }
  /* ===== دخول البث ===== */
  .msg.join { opacity:.8; }
  #feed.nojoin .msg.join { display:none; }
  /* ===== الهدايا حسب القيمة (t0 أصغر شي ... t4 أكبر شي) ===== */
  .msg.gift { padding:5px 8px; }
  .gift .cnt { color:var(--gift); font-weight:700; margin-inline-end:4px; }
  .gift .gi { width:30px; height:30px; vertical-align:middle; margin-inline-end:4px; }
  .gift .ge { font-size:20px; vertical-align:middle; margin-inline-end:4px; }
  .msg.gift.t1 { background:linear-gradient(90deg,rgba(255,176,32,.30),transparent 80%); }
  .msg.gift.t2 { background:linear-gradient(90deg,rgba(255,140,40,.42),transparent 85%); border-inline-start:4px solid #ff8c28; font-size:18px; }
  .msg.gift.t2 .gi { width:38px; height:38px; }
  .msg.gift.t3 { background:linear-gradient(90deg,rgba(255,79,163,.45),rgba(255,176,32,.22) 60%,transparent); border-inline-start:5px solid #ff4fa3; font-size:20px; padding:8px 10px; margin:4px 0; }
  .msg.gift.t3 .gi { width:48px; height:48px; }
  .msg.gift.t4 { background:linear-gradient(90deg,rgba(255,50,120,.6),rgba(255,176,32,.35) 60%,transparent); border-inline-start:6px solid #ff2d78; font-size:23px; padding:10px 12px; margin:6px 0; animation:gpulse 1.6s ease-in-out infinite; }
  .msg.gift.t4 .gi { width:60px; height:60px; }
  @keyframes gpulse { 50% { box-shadow:0 0 18px rgba(255,45,120,.65); } }
  @media (prefers-reduced-motion:reduce){ .msg.gift.t4 { animation:none; } }
  /* ===== الرسائل المثبتة ===== */
  #pins { margin:0 10px 6px; display:flex; flex-direction:column; gap:4px; max-height:35%; overflow-y:auto; direction:ltr; }
  #pins[hidden] { display:none; }
  .pin { position:relative; background:linear-gradient(90deg,rgba(145,70,255,.28),var(--panel) 80%); border:1px solid var(--line); border-radius:10px; padding:6px 34px 6px 10px; line-height:1.75; font-size:16px; text-align:left; overflow-wrap:anywhere; }
  .pin .unpin { position:absolute; right:6px; top:6px; border:0; background:none; color:var(--muted); cursor:pointer; font-size:14px; }
  .pin .unpin:hover { color:#fff; }
  .pin .pinic { margin-right:6px; }
</style>
</head>
<body>
<header id="stats"></header>
<nav>
  <div id="tabs">
    <button data-f="all" aria-pressed="true">الكل</button>
    <button data-f="tiktok" aria-pressed="false">تيك توك</button>
    <button data-f="twitch" aria-pressed="false">تويتش</button>
    <button data-f="kick" aria-pressed="false">كيك</button>
  </div>
  <div id="pos">الشات:
    <button data-pos="right" aria-pressed="false">يمين</button>
    <button data-pos="left" aria-pressed="false">يسار</button>
    <button data-pos="full" aria-pressed="false">كامل</button>
    <button id="hist" aria-pressed="true" title="عرض آخر رسائل الشات حتى لو البث أوفلاين">السجل</button>
    <button id="joins" aria-pressed="true" title="إظهار/إخفاء من يدخل بث تيك توك">الدخول</button>
  </div>
</nav>
<div id="pins" hidden></div>
<main id="feed" data-f="all" aria-live="polite"></main>
<footer id="bar"></footer>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const NAMES = { tiktok: 'تيك توك', twitch: 'تويتش', kick: 'كيك' };
const S = { tiktok: {}, twitch: {}, kick: {} };
const tw = { token: null, userId: null, login: null, chanId: null };
let cfg = {};
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const esc = s => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };
const num = n => (n == null ? '—' : Number(n).toLocaleString('en'));
let toastT;
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('on'), 3500); }

// ---------- الإحصائيات ----------
function renderStats() {
  $('#stats').innerHTML = ['tiktok', 'twitch', 'kick'].map(k => {
    const s = S[k];
    return `<div class="card ${s.live ? 'live' : ''}" style="--c:var(--${k})">
      <b><span class="dot"></span>${NAMES[k]}</b>
      <div class="row"><span>👥 ${num(s.followers)} متابع</span><span>👁 ${s.live ? num(s.viewers) : 'أوفلاين'}</span></div>
      <div class="st">${esc(s.status || '')}</div></div>`;
  }).join('');
}
renderStats();

// ---------- تنسيق النص (روابط + إيموجي) ----------
function linkify(t) {
  return esc(t).replace(/(https?:\/\/[^\s<]+|www\.[^\s<]+)/gi, u => {
    const href = u.startsWith('www.') ? 'https://' + u : u;
    return `<a class="link" href="${href}" target="_blank" rel="noopener noreferrer nofollow">${u}</a>`;
  });
}
function fmtTwitch(text, emotesTag) {
  if (!emotesTag) return linkify(text);
  const chars = Array.from(text), spans = [];
  for (const e of emotesTag.split('/')) {
    const [id, ranges] = e.split(':');
    for (const r of ranges.split(',')) { const [a, b] = r.split('-').map(Number); spans.push({ a, b, id }); }
  }
  spans.sort((x, y) => x.a - y.a);
  let out = '', pos = 0;
  for (const s of spans) {
    out += linkify(chars.slice(pos, s.a).join(''));
    out += `<img class="emote" alt="${esc(chars.slice(s.a, s.b + 1).join(''))}" src="https://static-cdn.jtvnw.net/emoticons/v2/${s.id}/default/dark/1.0">`;
    pos = s.b + 1;
  }
  return out + linkify(chars.slice(pos).join(''));
}
function fmtKick(text) {
  return String(text ?? '').split(/(\[emote:\d+:[^\]]+\])/).map(p => {
    const m = p.match(/^\[emote:(\d+):([^\]]+)\]$/);
    return m ? `<img class="emote" alt="${esc(m[2])}" src="https://files.kick.com/emotes/${m[1]}/fullsize">` : linkify(p);
  }).join('');
}

// ---------- شعارات المنصات والشارات ----------
const PLAT = {
  tiktok: '<svg viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07Z"/></svg>',
  twitch: '<svg viewBox="0 0 24 24"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/></svg>',
  kick: '<svg viewBox="0 0 24 24"><path d="M1.333 0h8v5.333H12V2.667h2.667V0h8v8H20v2.667h-2.667v2.666H20V16h2.667v8h-8v-2.667H12v-2.666H9.333V24h-8Z"/></svg>',
};
const EMOJI_BADGE = { broadcaster: '📺', moderator: '🛡️', vip: '💎', subscriber: '⭐' };
const ICON = {
  pin: '<svg viewBox="0 0 24 24"><path d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg>',
  ban: '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM4 12c0-4.42 3.58-8 8-8 1.85 0 3.55.63 4.9 1.69L5.69 16.9A7.9 7.9 0 014 12zm8 8c-1.85 0-3.55-.63-4.9-1.69L18.31 7.1A7.9 7.9 0 0120 12c0 4.42-3.58 8-8 8z"/></svg>',
  clock: '<svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>',
  trash: '<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>',
  mega: '<svg viewBox="0 0 24 24"><path d="M3 10v4a1 1 0 001 1h2l5 4V5L6 9H4a1 1 0 00-1 1zm13.5 2A4.5 4.5 0 0014 8v8a4.5 4.5 0 002.5-4zM14 3.2v2.1a7 7 0 010 13.4v2.1a9 9 0 000-17.6z"/></svg>',
};
const BADGES = {};
const STATIC_BADGES = {
  'moderator/1': 'https://static-cdn.jtvnw.net/badges/v1/3267646d-33f0-4b17-b3df-f923a41db1d0/1',
  'vip/1': 'https://static-cdn.jtvnw.net/badges/v1/b817aba4-fad8-49e2-b88a-7cc744dfa6ec/1',
  'broadcaster/1': 'https://static-cdn.jtvnw.net/badges/v1/5527c58c-fb7d-422d-b71b-f309dcb85cc1/1',
};
function addSets(sets) {
  for (const k of ['broadcaster', 'moderator', 'lead_moderator', 'vip', 'subscriber'])
    for (const [v, o] of Object.entries(sets?.[k]?.versions || {})) BADGES[k + '/' + v] = o.image_url_1x;
}
async function loadBadges() {
  Object.assign(BADGES, STATIC_BADGES);
  try {
    addSets((await (await fetch('https://badges.twitch.tv/v1/badges/global/display')).json()).badge_sets);
    const id = (await (await fetch('https://decapi.me/twitch/id/' + cfg.twitch)).text()).trim();
    if (/^\d+$/.test(id)) addSets((await (await fetch(`https://badges.twitch.tv/v1/badges/channels/${id}/display`)).json()).badge_sets);
  } catch {}
}
const TAGS = {
  broadcaster: ['صاحب البث', 'owner'], moderator: ['مود', 'mod'], lead_moderator: ['مود', 'mod'],
  vip: ['VIP', 'vip'],
};
function badgesHtml(d) {
  const seen = new Set(), out = [];
  for (const b of d.badges || []) {
    const t = TAGS[String(b).split('/')[0]];
    if (!t || seen.has(t[0])) continue;
    seen.add(t[0]);
    out.push(`<span class="tag ${t[1]}">${t[0]}</span>`);
  }
  return out.join('');
}

// ---------- مكان الشات ----------
function setPos(p) {
  document.body.dataset.pos = p;
  document.querySelectorAll('#pos button[data-pos]').forEach(x => x.setAttribute('aria-pressed', x.dataset.pos === p));
  store.set('chat_pos', p);
}
$('#pos').onclick = e => { const b = e.target.closest('button[data-pos]'); if (b) setPos(b.dataset.pos); };
$('#hist').setAttribute('aria-pressed', store.get('hist') !== '0');
$('#hist').onclick = () => { store.set('hist', store.get('hist') === '0' ? '1' : '0'); location.reload(); };
setPos(['right', 'left', 'full'].includes(store.get('chat_pos')) ? store.get('chat_pos') : 'full');

// ---------- الفيد ----------
const feed = $('#feed');

// دخول البث: إظهار/إخفاء
function setJoins(on) { feed.classList.toggle('nojoin', !on); $('#joins').setAttribute('aria-pressed', on); store.set('joins', on ? '1' : '0'); }
$('#joins').onclick = () => setJoins(feed.classList.contains('nojoin'));
setJoins(store.get('joins') !== '0');
const joined = new Map();

// تثبيت الرسائل (يتحفظ في المتصفح، أقصى 3)
const PINS = [];
try { PINS.push(...JSON.parse(store.get('pins') || '[]')); } catch {}
function renderPins() {
  const box = $('#pins');
  box.innerHTML = PINS.map((p, i) => `<div class="pin"><button class="unpin" data-i="${i}" title="إلغاء التثبيت" type="button">✕</button><span class="pinic">📌</span>${p.html}</div>`).join('');
  box.hidden = !PINS.length;
  store.set('pins', JSON.stringify(PINS));
}
function pinMsg(el) {
  const c = el.cloneNode(true);
  c.querySelectorAll('.acts').forEach(x => x.remove());
  const html = c.innerHTML, i = PINS.findIndex(p => p.html === html);
  if (i >= 0) PINS.splice(i, 1);
  PINS.unshift({ html });
  if (PINS.length > 3) PINS.length = 3;
  renderPins(); toast('تم تثبيت الرسالة 📌');
}
$('#pins').onclick = e => { const b = e.target.closest('.unpin'); if (b) { PINS.splice(+b.dataset.i, 1); renderPins(); } };
renderPins();

// صور الحسابات (تيك توك تجي من السيرفر، تويتش وكيك نجيبها من السيرفر)
const BLANK = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
const AV = new Map();
function avatarUrl(src, name) {
  const k = src + ':' + name.toLowerCase();
  if (!AV.has(k)) AV.set(k, fetch(`/avatar?src=${src}&name=${encodeURIComponent(name)}`).then(r => r.json()).then(j => j.url || '').catch(() => ''));
  return AV.get(k);
}
function avatarHtml(d, extra) {
  if (d.source === 'tiktok') return d.avatar ? `<img class="av" src="${esc(d.avatar)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : '';
  const n = d.source === 'twitch' ? extra.login : d.name;
  return n ? `<img class="av" src="${BLANK}" alt="" data-s="${d.source}" data-n="${esc(n)}">` : '';
}

// أسماء الهدايا بالعربي + إيموجي، والمستوى حسب القيمة
const GIFTS = [
  [/hand hearts?/i, '🫶', 'قلوب اليدين'], [/rose/i, '🌹', 'وردة'], [/lion/i, '🦁', 'أسد'], [/universe/i, '🌌', 'يونيفرس'], [/galaxy/i, '🌠', 'قالاكسي'],
  [/finger heart/i, '🫰', 'قلب الأصابع'], [/doughnut|donut/i, '🍩', 'دونات'], [/perfume/i, '🧴', 'عطر'],
  [/corgi/i, '🐶', 'كورجي'], [/confetti/i, '🎉', 'كونفيتي'], [/sports car/i, '🏎️', 'سيارة سبورت'],
  [/money gun/i, '💸', 'مسدس الفلوس'], [/crown/i, '👑', 'تاج'], [/whale/i, '🐋', 'حوت'], [/dragon/i, '🐉', 'تنين'],
  [/castle/i, '🏰', 'قلعة'], [/rocket/i, '🚀', 'صاروخ'], [/panda/i, '🐼', 'باندا'], [/ice cream/i, '🍦', 'آيس كريم'],
  [/swan/i, '🦢', 'بجعة'], [/heart/i, '💖', 'قلب'], [/diamond|gem/i, '💎', 'جوهرة'], [/tiktok/i, '🎵', 'تيك توك'],
];
function giftInfo(name, id) {
  const g = GIFTS.find(x => x[0].test(name || ''));
  return g ? { emoji: g[1], ar: g[2] } : { emoji: '🎁', ar: name || (id ? 'هدية #' + id : 'هدية') };
}
// غيّر الأرقام هنا لو تبي المستويات تتغير
const tier = n => n >= 10000 ? 't4' : n >= 1000 ? 't3' : n >= 100 ? 't2' : n >= 10 ? 't1' : 't0';

function add(d, cls, html, extra = {}) {
  const near = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80;
  const el = document.createElement('div');
  el.className = 'msg ' + cls; el.dataset.src = d.source;
  Object.assign(el.dataset, extra);
  const mod = extra.uid ? `
      <button data-act="ban" title="حظر">${ICON.ban}</button><button data-act="to" title="تايم أوت 10 دقايق">${ICON.clock}</button>
      <button data-act="del" title="حذف الرسالة">${ICON.trash}</button><button data-act="so" title="شوت أوت">${ICON.mega}</button>` : '';
  const pin = cls === 'chat' ? `<button data-act="pin" title="تثبيت في أعلى الشات">${ICON.pin}</button>` : '';
  const acts = (mod || pin) ? `<span class="acts">${pin}${mod}</span>` : '';
  el.innerHTML = `${acts}<span class="plat" style="color:var(--${d.source})" title="${NAMES[d.source]}">${PLAT[d.source]}</span>${avatarHtml(d, extra)}${html}`;
  feed.appendChild(el);
  const im = el.querySelector('img.av[data-n]');
  if (im) avatarUrl(im.dataset.s, im.dataset.n).then(u => { if (u) { im.onerror = () => im.remove(); im.src = u; } });
  while (feed.children.length > 300) feed.removeChild(feed.firstChild);
  if (near) feed.scrollTop = feed.scrollHeight;
}
const nm = (d, colon) => `<span class="name"${d.color ? ` style="color:${esc(d.color)}"` : ''}>${esc(d.name)}</span>` + (colon ? '<span class="colon">:</span>' : '');

function render(d) {
  const n = nm(d);
  switch (d.type) {
    case 'chat': add(d, 'chat', badgesHtml(d) + nm(d, 1) + '<span class="txt">' + (d.source === 'kick' ? fmtKick(d.text) : linkify(d.text)) + '</span>'); break;
    case 'gift': {
      const g = giftInfo(d.gift, d.giftId), t = tier(d.diamonds || 0), fire = t === 't4' ? '🔥🔥 ' : t === 't3' ? '🔥 ' : '';
      const pic = d.icon ? `<img class="gi" src="${esc(d.icon)}" alt="" onerror="this.outerHTML='<span class=&quot;ge&quot;>${g.emoji}</span>'">` : `<span class="ge">${g.emoji}</span>`;
      add(d, 'gift ' + t, `${fire}${n}<span class="big" title="${esc(d.gift)}">أرسل ${esc(g.ar)}</span> ${pic}<span class="cnt">×${d.count}</span> <span class="ev">(${num(d.diamonds)} 💎)</span>`);
      break; }
    case 'join': {
      const k = d.id || d.name, now = Date.now();
      if (joined.get(k) > now - 600000) break;
      joined.set(k, now); if (joined.size > 2000) joined.clear();
      add(d, 'join', `${n}<span class="ev">دخل البث 👋</span>`); break; }
    case 'follow': add(d, 'follow', `${n}<span class="ev">تابع الحساب</span>`); break;
    case 'share': add(d, 'share', `${n}<span class="ev">شارك البث</span>`); break;
    case 'sub': add(d, 'sub', `${n}<span class="ev">اشترك ⭐</span>`); break;
    case 'subgift': add(d, 'sub', `${n}<span class="ev">أهدى ${d.count} اشتراك 🎁</span>`); break;
    case 'notice': add(d, 'sub', `<span class="ev">${esc(d.text)}</span>`); break;
  }
}

$('#tabs').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  feed.dataset.f = b.dataset.f;
  document.querySelectorAll('#tabs button').forEach(x => x.setAttribute('aria-pressed', x === b));
  feed.scrollTop = feed.scrollHeight;
};

// ---------- تيك توك + كيك (من السيرفر) ----------
function startServerFeed() {
  const es = new EventSource('/events');
  es.onmessage = ev => {
    const d = JSON.parse(ev.data);
    if (d.type === 'stats') { Object.assign(S[d.source], d); renderStats(); } else render(d);
  };
}

// ---------- تويتش: قراءة الشات (بدون تسجيل دخول) ----------
let histLoaded = false;
function startTwitchChat() {
  const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  ws.onopen = () => {
    ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
    ws.send('PASS SCHMOOPIIE'); ws.send('NICK justinfan' + Math.floor(Math.random() * 90000 + 10000));
    ws.send('JOIN #' + cfg.twitch.toLowerCase());
  };
  const handleLine = line => {
    const m = line.match(/^(?:@(\S+) )?:(\S+?)(?:!\S+)? (PRIVMSG|USERNOTICE|JOIN) #\S+(?: :(.*))?$/);
    if (!m) return;
    const tags = {};
    (m[1] || '').split(';').forEach(p => { const i = p.indexOf('='); tags[p.slice(0, i)] = p.slice(i + 1); });
    if (m[3] === 'JOIN') { S.twitch.status = 'متصل'; renderStats(); return; }
    if (m[3] === 'USERNOTICE') {
      const sys = (tags['system-msg'] || '').replace(/\\s/g, ' ');
      if (sys) render({ source: 'twitch', type: 'notice', text: sys + (m[4] ? ' — ' + m[4] : '') });
      return;
    }
    const name = tags['display-name'] || m[2];
    const d = { source: 'twitch', color: tags.color || '', name, badges: (tags.badges || '').split(',').filter(Boolean) };
    add(d, 'chat', badgesHtml(d) + nm(d, 1) + '<span class="txt">' + fmtTwitch(m[4] || '', tags.emotes) + '</span>',
      { uid: tags['user-id'], login: m[2], mid: tags.id, ts: tags['tmi-sent-ts'] });
  };
  ws.onmessage = ev => ev.data.split('\r\n').filter(Boolean).forEach(line => {
    if (line.startsWith('PING')) return ws.send('PONG :tmi.twitch.tv');
    handleLine(line);
  });
  if (!histLoaded && store.get('hist') !== '0') {
    histLoaded = true;
    fetch(`https://recent-messages.robotty.de/api/v2/recent-messages/${cfg.twitch.toLowerCase()}?limit=50`)
      .then(r => r.json()).then(j => (j.messages || []).forEach(handleLine)).catch(() => {});
  }
  ws.onclose = () => { S.twitch.status = 'انقطع، أعيد الاتصال...'; renderStats(); setTimeout(startTwitchChat, 4000); };
}

async function pollTwitchStats() {
  try {
    const f = (await (await fetch(`https://decapi.me/twitch/followcount/${cfg.twitch}`)).text()).trim();
    if (/^\d+$/.test(f)) S.twitch.followers = +f;
    const v = (await (await fetch(`https://decapi.me/twitch/viewercount/${cfg.twitch}`)).text()).trim();
    if (/^\d+$/.test(v)) { S.twitch.viewers = +v; S.twitch.live = true; } else { S.twitch.viewers = 0; S.twitch.live = false; }
  } catch {}
  renderStats();
}

// ---------- تويتش: تسجيل الدخول والمودريشن ----------
const SCOPES = ['user:write:chat', 'moderator:manage:banned_users', 'moderator:manage:chat_messages',
  'moderator:manage:shoutouts', 'moderator:manage:announcements'];

function login() {
  const state = crypto.randomUUID();
  try { sessionStorage.setItem('tw_state', state); } catch {}
  location.href = 'https://id.twitch.tv/oauth2/authorize?' + new URLSearchParams({
    client_id: cfg.twitchClientId, redirect_uri: location.origin + '/', response_type: 'token',
    scope: SCOPES.join(' '), state });
}
function logout() { store.del('tw_token'); location.reload(); }

function readAuthHash() {
  if (!location.hash.includes('access_token')) return;
  const p = new URLSearchParams(location.hash.slice(1));
  let ok = false;
  try { ok = p.get('state') === sessionStorage.getItem('tw_state'); } catch {}
  if (ok && p.get('access_token')) store.set('tw_token', p.get('access_token'));
  history.replaceState(null, '', location.pathname);
}

async function helix(method, path, body) {
  const r = await fetch('https://api.twitch.tv/helix/' + path, {
    method,
    headers: { Authorization: 'Bearer ' + tw.token, 'Client-Id': cfg.twitchClientId, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 401) { store.del('tw_token'); throw new Error('انتهت الجلسة، اربط حساب تويتش من جديد'); }
  if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.message || 'خطأ ' + r.status); }
  return r.status === 204 ? null : r.json();
}
async function idOf(l) {
  const j = await helix('GET', 'users?login=' + encodeURIComponent(l));
  if (!j.data[0]) throw new Error('المستخدم غير موجود');
  return j.data[0].id;
}
const q = () => `broadcaster_id=${tw.chanId}&moderator_id=${tw.userId}`;

async function doAction(act, el) {
  const uid = el.dataset.uid, name = el.dataset.login, mid = el.dataset.mid;
  if (act === 'to') { await helix('POST', 'moderation/bans?' + q(), { data: { user_id: uid, duration: 600 } }); toast(`تايم أوت 10 دقايق: ${name}`); }
  if (act === 'ban') { if (!confirm(`حظر ${name} نهائياً؟`)) return; await helix('POST', 'moderation/bans?' + q(), { data: { user_id: uid } }); toast(`تم حظر ${name}`); }
  if (act === 'del') { await helix('DELETE', `moderation/chat?${q()}&message_id=${mid}`); toast('تم حذف الرسالة'); }
  if (act === 'so') { await helix('POST', `chat/shoutouts?from_broadcaster_id=${tw.chanId}&to_broadcaster_id=${uid}&moderator_id=${tw.userId}`); toast(`شوت أوت لـ ${name}`); }
}

async function submit(text) {
  text = text.trim(); if (!text) return;
  if (!text.startsWith('/')) { await helix('POST', 'chat/messages', { broadcaster_id: tw.chanId, sender_id: tw.userId, message: text }); return; }
  const [cmd, ...a] = text.slice(1).split(/\s+/);
  const user = (a[0] || '').replace('@', '').toLowerCase();
  switch (cmd.toLowerCase()) {
    case 'timeout': case 't': { const id = await idOf(user); const s = parseInt(a[1]) || 600;
      await helix('POST', 'moderation/bans?' + q(), { data: { user_id: id, duration: s, reason: a.slice(2).join(' ') || undefined } }); toast(`تايم أوت ${s} ثانية: ${user}`); break; }
    case 'ban': { const id = await idOf(user);
      await helix('POST', 'moderation/bans?' + q(), { data: { user_id: id, reason: a.slice(1).join(' ') || undefined } }); toast(`تم حظر ${user}`); break; }
    case 'unban': case 'untimeout': { const id = await idOf(user);
      await helix('DELETE', `moderation/bans?${q()}&user_id=${id}`); toast(`رُفع الحظر عن ${user}`); break; }
    case 'so': case 'shoutout': { const id = await idOf(user);
      await helix('POST', `chat/shoutouts?from_broadcaster_id=${tw.chanId}&to_broadcaster_id=${id}&moderator_id=${tw.userId}`); toast(`شوت أوت لـ ${user}`); break; }
    case 'announce': await helix('POST', 'chat/announcements?' + q(), { message: a.join(' ') }); break;
    case 'clear': await helix('DELETE', 'moderation/chat?' + q()); toast('تم مسح الشات'); break;
    default: throw new Error('أمر غير معروف. المتاح: /timeout /ban /unban /so /announce /clear');
  }
}

feed.addEventListener('click', async e => {
  const msg = e.target.closest('.msg'); if (!msg) return;
  const b = e.target.closest('button[data-act]');
  if (!b) { if (!e.target.closest('a') && msg.classList.contains('chat')) msg.classList.toggle('open'); return; }
  if (b.dataset.act === 'pin') { pinMsg(msg); return; }
  if (!tw.userId) { toast('اربط حساب تويتش أول (الزر اللي تحت)'); return; }
  try { await doAction(b.dataset.act, msg); } catch (err) { toast(err.message); }
});

async function setupBar() {
  const bar = $('#bar');
  if (!cfg.twitchClientId) { bar.innerHTML = '<small>ربط تويتش غير مفعّل: ينقص TWITCH_CLIENT_ID في إعدادات السيرفر.</small>'; return; }
  tw.token = store.get('tw_token');
  if (!tw.token) { bar.innerHTML = '<button id="login" type="button">ربط حساب تويتش (للرد والمودريشن)</button>'; $('#login').onclick = login; return; }
  try {
    const v = await (await fetch('https://id.twitch.tv/oauth2/validate', { headers: { Authorization: 'OAuth ' + tw.token } })).json();
    if (!v.user_id) throw new Error();
    tw.userId = v.user_id; tw.login = v.login; tw.chanId = await idOf(cfg.twitch);
  } catch { store.del('tw_token'); bar.innerHTML = '<button id="login" type="button">ربط حساب تويتش (للرد والمودريشن)</button>'; $('#login').onclick = login; return; }
  bar.innerHTML = `<input id="msg" placeholder="اكتب رسالة لشات تويتش أو أمر مثل /timeout اسم 600" autocomplete="off">
    <button id="send" type="button">إرسال</button><small>${esc(tw.login)} · <a href="#" id="out" class="link">خروج</a></small>`;
  const go = async () => { const i = $('#msg'); const t = i.value; i.value = ''; try { await submit(t); } catch (err) { toast(err.message); i.value = t; } };
  $('#send').onclick = go;
  $('#msg').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('#out').onclick = e => { e.preventDefault(); logout(); };
}

(async function init() {
  cfg = await fetch('/config').then(r => r.json()).catch(() => ({ twitch: 'libashayer' }));
  readAuthHash();
  startServerFeed();
  startTwitchChat();
  pollTwitchStats(); setInterval(pollTwitchStats, 30000);
  setupBar();
})();
</script>
